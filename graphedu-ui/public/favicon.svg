<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000"><g clip-path="url(#SvgjsClipPath1168)"><rect width="1000" height="1000" fill="#ffffff"></rect><g transform="matrix(2.5,0,0,2.5,0,0)"><svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400"><svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变色：从下方的浅蓝色过渡到上方的紫色 -->
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00c6fb"></stop>
      <stop offset="100%" stop-color="#9D50BB"></stop>
    </linearGradient>

    <!-- 背景图谱的渐变 -->
    <linearGradient id="bgGraphGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00c6fb"></stop>
      <stop offset="100%" stop-color="#9D50BB"></stop>
    </linearGradient>
  <clipPath id="SvgjsClipPath1168"><rect width="1000" height="1000" x="0" y="0" rx="500" ry="500"></rect></clipPath></defs>

  <!-- 背景：纯白色 -->
  <rect width="100%" height="100%" fill="#ffffff"></rect>

  <!-- 背景层：知识图谱群组 -->
  <!-- 统一设置透明度 0.2，使其更隐约 -->
  <!-- 填充和描边都使用渐变色 -->
  <g opacity="0.2" stroke="url(#bgGraphGradient)" fill="url(#bgGraphGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- === 右上角结构 === -->
    <g id="top-right-graph">
      <!-- 连线 -->
      <line x1="120" y1="70" x2="155" y2="45"></line>
      <line x1="120" y1="70" x2="155" y2="110"></line>
      <line x1="155" y1="45" x2="155" y2="110"></line>

      <!-- 节点（大小不一） -->
      <circle cx="120" cy="70" r="16"></circle> <!-- 大 -->
      <circle cx="155" cy="45" r="10"></circle> <!-- 中 -->
      <circle cx="155" cy="110" r="7"></circle> <!-- 小 -->
    </g>

    <!-- === 左下角结构（新增） === -->
    <g id="bottom-left-graph">
      <!-- 连线：构成一个稳固的三角形结构 -->
      <line x1="45" y1="155" x2="80" y2="130"></line>
      <line x1="45" y1="155" x2="30" y2="120"></line>
      <line x1="80" y1="130" x2="30" y2="120"></line>

      <!-- 节点：大小不一，错落有致 -->
      <circle cx="45" cy="155" r="14"></circle> <!-- 主节点，较大 -->
      <circle cx="80" cy="130" r="9"></circle>  <!-- 分支节点，中等 -->
      <circle cx="30" cy="120" r="5"></circle>  <!-- 边缘节点，较小 -->
    </g>
  </g>

  <!-- 前景层：字母 G -->
  <!-- 压在所有背景图谱之上 -->
  <path d="M 102.32422,111.72223 V 90.872616 h 47.85156 v 42.724614 q -13.74023,9.36523 -24.33594,12.7832 -10.52734,3.34961 -25.01953,3.34961 -17.841794,0 -29.121091,-6.08399 -11.210938,-6.08398 -17.431641,-18.11523 -6.152344,-12.03125 -6.152344,-27.617189 0,-16.40625 6.767578,-28.505859 6.767579,-12.167969 19.824219,-18.457031 10.185547,-4.853516 27.412109,-4.853516 16.61133,0 24.81445,3.007813 8.27149,3.007812 13.67188,9.365234 5.46875,6.289063 8.20312,15.996094 l -29.87304,5.332031 q -1.84571,-5.673828 -6.28907,-8.681641 -4.375,-3.007812 -11.21093,-3.007812 -10.18555,0 -16.269534,7.109375 -6.015625,7.041016 -6.015625,22.353516 0,16.269535 6.083984,23.242185 6.152344,6.97266 17.089845,6.97266 5.19531,0 9.91211,-1.50391 4.7168,-1.5039 10.80078,-5.12695 v -9.43359 z" id="text12" style="font-weight:900;font-size:140px;font-family:'Arial Black', 'Helvetica Neue', sans-serif;dominant-baseline:central;text-anchor:middle;fill:url(#techGradient)" aria-label="G"></path>
</svg></svg></g></g></svg>