name: Auto Deployment
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**/docs/**'
      - '**/tests/**'
      - '**.test.*'
      - '**.spec.*'
      - 'graphedu-ui/e2e/**'
      - 'graphedu-ui/playwright.config.ts'
      - 'graphedu-ui/vitest.config.*'
      - 'graphedu-ui/tsconfig.vitest.json'
      - 'graphedu-ui/.*rc.*'
      - 'graphedu-ui/.env.development'
      - 'graphedu-ui/.npmrc'
      - 'graphedu-ui/pnpm-workspace.yaml'
      - '.claude/**'
      - 'scripts/**'
      - '**/.*ignore'
      - '.python-version'
      - 'example.config.yaml'
      - 'LICENSE*'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    environment: production
    # https://docs.github.com/zh/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_iddefaults
    defaults: # 本次 job run 的 working-directory
      run:
        working-directory: ./graphedu-ui

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          node-version-file: ./graphedu-ui/package.json
          cache-dependency-path: ./graphedu-ui/pnpm-lock.yaml
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build-only

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./graphedu-ui/dist/
          retention-days: 1

  deploy:
    name: Deploy to Production
    needs: build-frontend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: graphedu-ui/dist/

      - name: check dist
        run: ls -la graphedu-ui/dist/

      - name: Verify Required Secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "::error::Missing secret: SERVER_HOST"
            MISSING=$((MISSING+1))
          fi
          if [ -z "${{ secrets.SERVER_USERNAME }}" ]; then
            echo "::error::Missing secret: SERVER_USERNAME"
            MISSING=$((MISSING+1))
          fi
          if [ -z "${{ secrets.SERVER_DEPLOYMENT_PATH }}" ]; then
            echo "::error::Missing secret: SERVER_DEPLOYMENT_PATH"
            MISSING=$((MISSING+1))
          fi
          if [ $MISSING -gt 0 ]; then exit 1; fi

      # https://github.com/marketplace/actions/scp-files
      - name: Copy dist to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "graphedu-ui/dist/*"
          target: ${{ secrets.SERVER_DEPLOYMENT_PATH }}/graphedu-ui/dist
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          script: |
            DEPLOY_PATH="${{ secrets.SERVER_DEPLOYMENT_PATH }}"
            cd "$DEPLOY_PATH"
            bash docker/deploy.sh -v
