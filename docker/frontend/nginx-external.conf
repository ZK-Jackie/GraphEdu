# GraphEdu 外层反向代理配置
#
# 部署位置：宿主机 Nginx
# 职责：TLS 终结、HTTP/2、Brotli/Gzip 压缩、安全头
# 后端：proxy_pass 指向 Docker 容器映射的本地端口
#
# 使用方法：
#   1. 复制到宿主机 /etc/nginx/sites-available/graphedu.conf
#   2. ln -s /etc/nginx/sites-available/graphedu.conf /etc/nginx/sites-enabled/
#   3. 修改 server_name、ssl_certificate、proxy_pass 为实际值
#   4. nginx -t && systemctl reload nginx
upstream graphedu_service {
    server 127.0.0.1:11334;
}

# ========================================
# HTTP → HTTPS 重定向
# ========================================
server {
    listen 80;
    server_name your-domain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ========================================
# HTTPS 主站
# ========================================
server {
    listen 443 ssl;
    http2 on; # Nginx 1.25.1+ 写法，旧版本用 listen 443 ssl http2;

    server_name your-domain.com;

    # ----------------------------------------
    # TLS 证书（替换为实际路径）
    # ----------------------------------------
    ssl_certificate     /etc/nginx/ssl/graphedu.crt;
    ssl_certificate_key /etc/nginx/ssl/graphedu.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling（可选）
    # ssl_trusted_certificate /etc/nginx/ssl/chain.crt;
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ----------------------------------------
    # 安全响应头
    # ----------------------------------------
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ----------------------------------------
    # Brotli 压缩（需安装 ngx_brotli 模块）
    # Debian/Ubuntu: apt install libnginx-mod-http-brotli
    # 未安装则注释掉 brotli 开头的行
    # ----------------------------------------
    brotli on;
    brotli_comp_level 4;
    brotli_types text/plain text/css application/javascript application/json application/xml
                 text/javascript image/svg+xml application/manifest+json application/wasm;
    brotli_min_length 256;

    # Gzip 兜底（不支持 Brotli 的浏览器走 Gzip）
    gzip on;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/javascript application/json application/xml
               text/javascript image/svg+xml application/manifest+json application/wasm;
    gzip_min_length 256;
    gzip_vary on;

    # ----------------------------------------
    # Vite 带哈希资源：长缓存
    # ----------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://graphedu_service;
    }

    # ----------------------------------------
    # SPA 入口：不缓存
    # ----------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        proxy_pass http://graphedu_service;
    }

    # ----------------------------------------
    # 静态文件 & SPA fallback
    # ----------------------------------------
    location / {
        proxy_pass         http://graphedu_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------
    # 反向代理到后端 API
    # ----------------------------------------
    location /api/ {
        proxy_pass         http://graphedu_service;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket 支持（SSE / WS 接口）
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ----------------------------------------
    # 日志
    # ----------------------------------------
    access_log /var/log/nginx/graphedu_access.log;
    error_log  /var/log/nginx/graphedu_error.log;
}