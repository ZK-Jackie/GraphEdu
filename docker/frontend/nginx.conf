# GraphEdu Gateway Nginx 配置
#
# 职责：
#   1. SPA 静态文件服务（Vite 构建产物）
#   2. /api/ 反向代理到后端服务
#
# 不在此处处理的功能（请在宿主机 Nginx / Caddy / Traefik 等外层代理中配置）：
#   - HTTPS / SSL 证书
#   - Gzip / Brotli 压缩
#   - 访问限速 / WAF
#   - CDN 缓存策略

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------
    # Vite 构建产物（带 hash 文件名）：长缓存
    # 仅匹配 assets/ 目录下的 JS/CSS/字体，不处理图片和上传资源
    # ----------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----------------------------------------
    # SPA 入口：不缓存 index.html
    # ----------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ----------------------------------------
    # Vue Router history 模式 fallback
    # ----------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------
    # 反向代理到后端 API
    # ----------------------------------------
    location /api/ {
        proxy_pass         http://graphedu-backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket 支持（SSE / WS 接口）
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
