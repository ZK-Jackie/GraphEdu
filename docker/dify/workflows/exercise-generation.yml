            2. **慎重考量难度**：充分考虑生成测验题目的难度，确保题目难度符合用户预期，可选的难度从简到难依次为：“基础”“简单”“中等”“较难”“极难”。请精准把握不同难度层级的知识点覆盖和思维要求，确保生成的题目难度准确合适。\n\
            3. **试题生成**：为主题生成一道多项选择题，包括题干和四至七个选项，在答案处明确指出正确答案选项，多个选项答案以字符串数组形式组织。注意，出题时，一定会有**两个及以上**的选项是正确的。\n\
            4. **解释生成**：为生成的题解释选择正确答案的原因，可以提供一些题目涉及的知识点的易错点及更多信息。\n5. **格式化输出**：将生成的试题以JSON格式输出。\n\
            \n## 示例\n\n```json\n{\n  \"topic\": \"计算机科学\",\n  \"question\": \"以下哪些属于面向对象编程的特性？（可多选）\"\
            ,\n  \"options\": [\"A 封装\",\"B 继承\",\"C 多态\",\"D 函数式编程\"],\n  \"answer\"\
            : [\"A\",\"B\",\"C\"],\n  \"explanation\": \"面向对象编程的特性包括封装、继承和多态。封装是将数据和操作数据的方法绑定在一起，隐藏内部实现细节；继承允许创建一个新类继承现有类的属性和方法；多态是指同一个方法可以根据对象的不同类型而表现出不同的行为。函数式编程是一种编程范式，不属于面向对象编程的特性。\"\
            \n}\n```"
