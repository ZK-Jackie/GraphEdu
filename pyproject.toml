[project]
name = "graphedu"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12, <3.15"
dependencies = [
    "aiobotocore==3.1.0",
    "async-lru>=2.0.5,<3.0.0",
    "asyncio",
    "cashews[redis]>=7.4.4",
    "cron-converter>=1.3.1",
    "dependency-injector>=4.48.3,<5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0,<1.0.0",
    "httpx>=0.28.1",
    "langchain>=1.2.13",
    "pgvector>=0.4.2",
    "phonenumbers>=9.0.22",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-extra-types>=2.11.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "pyyaml>=6.0.3,<7.0.0",
    "sqlalchemy==2.0.48",
    "tenacity>=9.1.2,<10.0.0",
    "typer>=0.21.0,<1.0.0",
    "uvicorn>=0.40.0,<1.0.0",
    "uvloop; sys_platform == 'linux' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
service = [
    "aiofiles>=24.1.0,<26.0.0",
    "apscheduler>=3.11.2,<4.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    "boto3==1.42.16",
    "captcha>=0.7.1",
    "celery>=5.6.3,<6.0.0",
    "fastmcp>=3.1.1",
    "graphrag>=3.0.8,<3.1.0",
    "json-repair>=0.55.0,<1.0.0",
    "langchain-core>=1.2.6,<2.0.0",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.1.6,<2.0.0",
    "langgraph>=1.0.5,<2.0.0",
    "langgraph-checkpoint-postgres>=3.0.2,<4.0.0",
    "neo4j>=6.0.3,<7.0.0",
    "pillow>=12.1.0",
    "psycopg[binary,pool]>=3.3.2",
    "pyjwt>=2.10.1,<3.0.0",
    "pymongo>=4.16.0",
    "redis>=7.1.0,<8.0.0",
    "user-agents>=2.2.0",
]

worker = [
    "celery>=5.6.3,<6.0.0",
    "graphrag>=3.0.8,<3.1.0",
    "graphrag-celery-callback",
    "graphrag-pgvector",
    "redis>=7.1.0,<8.0.0",
]

test = [
    "faker>=40.0.0,<41.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-html>=4.1.1,<5.0.0",
    "pytest-mock>=3.15.0,<4.0.0",
]

dev = [
    "boto3-stubs==1.42.16",
    "notebook>=7.5.1",
    "ruff>=0.14.13",
    "types-aiobotocore[s3]==3.1.0",
    "types-boto3[s3]==1.42.16",
]

[dependency-groups]
dev = [
    "celery-types>=0.24.0",
    "pandas-stubs~=2.3.3.0",
]



[tool.ruff]
# 目标 Python 版本
target-version = "py313"

# 代码行长度
line-length = 120

# 扫描的文件
include = ["graphedu/**/*.py"]

# 排除的目录
exclude = [
    ".git", ".idea", ".claude", ".vscode", ".venv", ".github", "__pycache__", "data", "docker", "docs", "graphedu-ui",
    "scripts", "*.egg-info", ".pytest_cache", ".mypy_cache", ".ruff_cache",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    # Pyflakes (F) - 基本错误检测
    "F",
    # pycodestyle (E, W) - PEP 8 规范
    "E",
    "W",
    # isort (I) - Import 排序
    "I",
    # pyupgrade (UP) - 现代 Python 语法升级
    "UP",
    # flake8-bugbear (B) - 常见 bug 检测
    "B",
    # flake8-comprehensions (C4) - 列表推导式优化
    "C4",
    # flake8-simplify (SIM) - 代码简化建议
    "SIM",
    # flake8-async (ASYNC) - 异步编程最佳实践
    "ASYNC",
    # flake8-return (RET) - 返回值相关
    "RET",
    # flake8-raise (RSE) - 异常抛出
    "RSE",
    # eradicate (ERA) - 注释掉的代码检测
    "ERA",
    # PEP8 naming (N) - 命名规范
    "N",
    # pydocstyle (D) - 文档字符串规范
    "D",
    # Ruff 特定规则 (RUF)
    "RUF",
]

# 忽略的规则
ignore = [
    "E402", # 允许模块级别导入不在文件顶部（避免循环导入）
    "B008", # 允许在函数参数中使用 Depends()、Query() 等 FastAPI 依赖注入
    "B015", # 允许无意义的比较（用于类型检查等）
    "D415", # 允许文档字符串首行不以标点结尾（中文项目习惯）
    "D200", # 允许单行文档字符串使用多行格式
    "D205", # 允许文档字符串缺少空行分隔
    "D107", # __init__ 方法不需要单独的 docstring（类的 docstring 已说明）
    "N812", # 允许用大写字母命名导入模块
    "N818", # 允许异常类使用 Exception 后缀（而非强制 Error）
    "RUF012", # 允许类属性不使用 ClassVar 注解（SQLAlchemy 模型需要）
    "SIM108", # 允许使用 if-else 表达式（有时更清晰）
    "ASYNC109", # 允许异步函数使用 timeout 参数（兼容性考虑）
    "ERA001", # 暂时不强制删除注释掉的代码
    "RUF002", # 允许文档字符串中使用中文标点符号（全角逗号、括号等）
    "RUF003", # 允许注释中使用中文标点符号（全角逗号、括号等）
    "RUF001", # 允许字符串中使用中文字符（中文项目必备）
    "RUF013", # 允许使用现代类型注解风格（int | None 而非 Optional[int]）
    "RUF104"    # 允许不闭合的屏蔽块
]

# 允许自动修复的规则
fixable = ["ALL"]
unfixable = []

# 每个文件忽略的规则
[tool.ruff.lint.per-file-ignores]
# 测试文件使用更宽松的规则
"tests/**/*.py" = [
    "S101", # 允许使用 assert
    "D", # 测试文件不强制要求 docstring
    "ANN", # 测试文件不强制类型注解
    "ARG", # 测试函数可能有意外的未使用参数
]


# 格式化配置
[tool.ruff.format]
# 使用双引号
quote-style = "double"

# 缩进风格（空格）
indent-style = "space"

# 保留魔法尾随逗号（有助于格式化多行参数）
skip-magic-trailing-comma = false

# 行结束符（自动检测）
line-ending = "auto"

# 文档字符串格式化配置
[tool.ruff.lint.pydocstyle]
# 文档字符串约定风格
convention = "google"

# Import 排序配置
[tool.ruff.lint.isort]
# 已知的第一方包
known-first-party = ["graphedu"]

# 是否强制每个导入类型之间使用换行分隔
force-sort-within-sections = true

# 是否合并导入（from . import a, b）
combine-as-imports = true



[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
cache_dir = "data/pytest/.pytest_cache"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--cov=graphedu",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:data/pytest/htmlcov",
    "--cov-report=xml:data/pytest/coverage.xml",
    "--cov-report=json:data/pytest/coverage.json",
    "--html=data/pytest/test-report.html",
    "--self-contained-html",
    "--junitxml=data/pytest/junit.xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "asyncio: Async tests",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["graphedu"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.uv.workspace]
members = [
    "libs/graphrag-pgvector",
    "libs/graphrag-celery-callback",
]

[tool.uv.sources]
graphrag-pgvector = { workspace = true, editable = true }
graphrag-celery-callback = { workspace = true, editable = true }
